<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FillSync Extension</title>
    <style>
      body {
        width: 350px;
        margin: 0;
        padding: 16px;
        background: #0f172a;
        color: #f8fafc;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #1e293b;
        padding-bottom: 10px;
        margin-bottom: 12px;
      }
      .brand {
        font-weight: 800;
        font-size: 16px;
        color: #2dd4bf;
      }
      .badge-free {
        font-size: 10px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 999px;
        background: #1e293b;
        color: #94a3b8;
        border: 1px solid #334155;
      }
      .badge-premium {
        font-size: 10px;
        font-weight: 800;
        padding: 3px 8px;
        border-radius: 999px;
        background: rgba(245, 158, 11, 0.2);
        color: #fcd34d;
        border: 1px solid rgba(245, 158, 11, 0.5);
      }
      label {
        display: block;
        font-size: 11px;
        color: #94a3b8;
        margin-bottom: 4px;
      }
      input[type="email"],
      input[type="password"],
      input[type="text"],
      select {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        margin-bottom: 10px;
        border-radius: 8px;
        border: 1px solid #334155;
        background: #1e293b;
        color: #fff;
        font-size: 12px;
      }
      button {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: none;
        font-weight: 700;
        font-size: 12px;
        cursor: pointer;
        margin-bottom: 8px;
      }
      .btn-primary {
        background: #14b8a6;
        color: #0f172a;
      }
      .btn-primary:hover {
        background: #2dd4bf;
      }
      .btn-secondary {
        background: #1e293b;
        color: #e2e8f0;
        border: 1px solid #334155;
      }
      .card-box {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 10px;
        padding: 10px;
        margin-bottom: 10px;
        font-size: 11px;
      }
      .row-between {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
      }
      .locked-text {
        color: #64748b;
      }
      .premium-tag {
        font-size: 9px;
        font-weight: 800;
        color: #fbbf24;
        background: rgba(245, 158, 11, 0.15);
        padding: 2px 6px;
        border-radius: 4px;
      }
      .upgrade-banner {
        background: rgba(245, 158, 11, 0.12);
        border: 1px solid rgba(245, 158, 11, 0.35);
        color: #fde68a;
        padding: 8px;
        border-radius: 8px;
        font-size: 11px;
        text-align: center;
        margin-bottom: 8px;
      }
      .btn-sync {
        background: #0d9488;
        color: #ffffff;
        border: 1px solid #14b8a6;
        box-shadow: 0 2px 8px rgba(13, 148, 136, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .btn-sync:hover {
        background: #14b8a6;
      }
      .btn-google {
        background: #ffffff;
        color: #0f172a;
        border: 1px solid #cbd5e1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .btn-google:hover {
        background: #f1f5f9;
      }
      .divider {
        display: flex;
        align-items: center;
        text-align: center;
        margin: 10px 0;
        color: #64748b;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      .divider::before, .divider::after {
        content: '';
        flex: 1;
        border-bottom: 1px solid #334155;
      }
      .divider span {
        padding: 0 8px;
      }
      .msg {
        font-size: 11px;
        color: #38bdf8;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <span class="brand">⚡ FillSync</span>
      <span id="planBadge" class="badge-free">Not Signed In</span>
    </div>

    <!-- 1. Login View -->
    <div id="loginSection">
      <!-- 1-Click Sync from Open Dashboard Tab -->
      <button class="btn-sync" id="syncDashboardBtn" type="button" title="Grab your login session directly from open FillSync dashboard">
        ⚡ 1-Click Sync from Dashboard
      </button>

      <!-- 1-Click Google Sign-In -->
      <button class="btn-google" id="googleLoginBtn" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" style="flex-shrink:0;">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.36 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.36 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
        </svg>
        Sign in with Google (Gmail)
      </button>

      <div class="divider"><span>OR SIGN IN WITH PASSWORD</span></div>

      <label>Email Address</label>
      <input type="email" id="emailInput" placeholder="Enter your email" autocomplete="off" value="bhargaveshpandit@gmail.com" />
      <label>Password</label>
      <input type="password" id="passwordInput" placeholder="Enter your password" autocomplete="new-password" />
      <button class="btn-primary" id="loginBtn" type="button">Sign In</button>
    </div>

    <!-- 2. Logged-In Controls (Adapts for Normal vs Premium User) -->
    <div id="controlsSection" style="display: none">
      <div class="row-between" style="margin-bottom: 10px">
        <span id="userNameDisplay" style="font-size: 13px; font-weight: 700">User</span>
        <span style="font-size: 11px; color: #4ade80">● Connected</span>
      </div>

      <!-- Folder Selector (Both Free & Premium) -->
      <label>Select Data Folder</label>
      <select id="folderSelect"></select>

      <button class="btn-primary" id="fillFormBtn">✨ Fill This Form (1-Click)</button>

      <!-- Template Selector & Injector (Both Free & Premium) -->
      <label style="margin-top: 4px">Select Smart Template</label>
      <select id="templateSelect"></select>
      <button class="btn-secondary" id="injectTemplateBtn">📝 Inject Template into Textbox</button>

      <!-- Premium Features Box (Locked for Free Users, Unlocked for Premium Users) -->
      <div class="card-box">
        <div class="row-between">
          <span style="font-weight: 700; color: #cbd5e1">Automation Mode</span>
          <span id="premiumBoxTag" class="premium-tag">★ PREMIUM</span>
        </div>

        <div class="row-between" style="margin-top: 6px">
          <span id="aiMappingLabel">AI Smart Field Mapping</span>
          <input type="checkbox" id="aiMappingToggle" />
        </div>

        <div class="row-between">
          <span id="multiStepLabel">Multi-Step Form Auto-Next</span>
          <input type="checkbox" id="multiStepToggle" />
        </div>

        <div class="row-between" style="margin-bottom: 0">
          <span id="turboSpeedLabel">Instant Turbo Fill Speed</span>
          <input type="checkbox" id="turboSpeedToggle" />
        </div>
      </div>

      <!-- Shown only to Normal (Free) Users -->
      <div id="freeUpgradeBanner" class="upgrade-banner" style="display: none">
        🔒 AI Field Mapping &amp; Multi-Step Fill are locked on Free Plan. Upgrade on Dashboard!
      </div>

      <button class="btn-secondary" id="logoutBtn">Logout</button>
    </div>

    <div class="msg" id="statusMsg"></div>

    <!-- API Server Switcher (Supports Localhost & Live Deployed Server) -->
    <div style="margin-top: 12px; padding-top: 8px; border-top: 1px solid #1e293b; text-align: center;">
      <span id="apiStatusText" style="font-size: 10px; color: #64748b; cursor: pointer; text-decoration: underline;">
        🔗 Server: Localhost (Port 5000) • Switch
      </span>
      <div id="apiUrlBox" style="display: none; margin-top: 6px;">
        <input type="text" id="customApiUrlInput" placeholder="https://fillsync-api.onrender.com/api" style="font-size: 11px; margin-bottom: 4px;" />
        <button class="btn-secondary" id="saveApiUrlBtn" style="padding: 5px; font-size: 11px; margin-bottom: 2px;">Save Server URL</button>
        <button class="btn-secondary" id="resetApiUrlBtn" style="padding: 5px; font-size: 10px; background: transparent; border: none; color: #94a3b8;">Reset to Localhost</button>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
